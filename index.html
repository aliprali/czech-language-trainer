<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čeština pro cizince - Generátor testů</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 20px; }
    .container { max-width: 640px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; text-align: center; font-size: 24px; margin-bottom: 5px; }
    .lang-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: #7f8c8d; margin-bottom: 15px; }
    .lang-bar select { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
    .intro { text-align: center; margin-bottom: 20px; }
    .intro h2 { color: #2c3e50; font-size: 20px; margin: 0 0 6px; }
    .intro p { color: #7f8c8d; font-size: 14px; margin: 0; }

    #topic-grid { display: flex; flex-direction: column; gap: 28px; }
    .topic-group .group-header { margin-bottom: 12px; }
    .topic-group .group-header h3 { margin: 0 0 2px; color: #2c3e50; font-size: 16px; }
    .topic-group .group-header p { margin: 0; color: #95a5a6; font-size: 13px; }
    .topic-group .group-body { display: grid; gap: 12px; }

    .topic-card { padding: 18px 20px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: left; background: #fff; transition: border-color .15s, background .15s, transform .15s; }
    .topic-card:hover { border-color: #3498db; background: #f0f9ff; transform: translateY(-1px); }
    .topic-card h3 { margin: 0 0 4px; color: #2c3e50; font-size: 17px; }
    .topic-card .meta { font-size: 13px; color: #7f8c8d; }

    .progress { text-align: right; font-size: 13px; color: #95a5a6; }
    .card { background: #f8fafc; border-left: 5px solid #3498db; padding: 15px; border-radius: 4px; margin-bottom: 15px; }
    .sentence { font-size: 18px; font-weight: 500; margin-bottom: 5px; }
    .hint { font-size: 13px; color: #7f8c8d; font-style: italic; }
    .options { display: grid; gap: 10px; margin-top: 15px; }
    button { padding: 12px; font-size: 15px; border: 2px solid #e2e8f0; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit; }
    button:hover:not(:disabled) { border-color: #3498db; background: #f0f9ff; }
    .correct-btn { background: #2ecc71 !important; border-color: #2ecc71 !important; color: white; }
    .wrong-btn { background: #e74c3c !important; border-color: #e74c3c !important; color: white; }
    .feedback { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; display: none; }
    .feedback.correct { display: block; background: #d4edda; color: #155724; }
    .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
    .explanation { margin-top: 8px; font-size: 13px; color: #34495e; text-align: center; }
    .score-screen { text-align: center; display: none; }
    .score-num { font-size: 40px; font-weight: bold; color: #2ecc71; margin: 15px 0; }
    .lifetime { font-size: 13px; color: #7f8c8d; margin-top: 8px; }
    .type-input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
    .type-input:focus { outline: none; border-color: #3498db; }
    .correct-input { border-color: #2ecc71 !important; background: #f0fff4; }
    .wrong-input { border-color: #e74c3c !important; background: #fff5f5; }
    .check-btn { background: #3498db; color: white; border: none; font-weight: 500; margin-top: 10px; }
    .check-btn:hover:not(:disabled) { background: #2980b9; }
    .link-btn { background: none; border: none; color: #3498db; text-decoration: underline; cursor: pointer; padding: 4px 8px; font-size: 13px; margin: 0 auto 10px; display: block; }
    .next-btn { display: block; width: 100%; margin-top: 15px; background: #3498db; color: white; border: none; text-align: center; height: 45px; cursor: pointer; border-radius: 8px; font-size: 16px; }
    .next-btn:hover:not(:disabled) { background: #2980b9; border: none; }

    .quiz-nav { display: flex; align-items: center; gap: 10px; margin-top: 15px; }
    .quiz-nav .nav-btn {
      flex: 1; padding: 12px 14px; background: #3498db; color: white;
      border: none; border-radius: 8px; font-size: 15px; cursor: pointer;
      text-align: center;
    }
    .quiz-nav .nav-btn:hover:not(:disabled) { background: #2980b9; }
    .quiz-nav .nav-btn:disabled { background: #bdc3c7; cursor: not-allowed; }

    .hoverable { font-weight: 700; border-bottom: 1px dotted #3498db; cursor: help; }
    .hoverable:hover { background: #eaf4fd; border-bottom-style: solid; }
    .hoverable.driver-highlight { background: #fff3cd; box-shadow: 0 0 0 2px #ffeaa7; }
    .hoverable.reflexive-highlight { background: #e0f0ff; box-shadow: 0 0 0 2px #74b9ff; }

    .hover-tooltip {
      position: fixed; z-index: 1000; background: #fff;
      border: 2px solid #3498db; border-radius: 8px;
      padding: 12px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.15);
      font-size: 12px; max-width: 90vw; max-height: 70vh; overflow: auto;
      display: none;
    }
    .hover-tooltip.visible { display: block; }
    .hover-tooltip h4 { margin: 0 0 2px; font-size: 14px; color: #2c3e50; }
    .hover-tooltip .example { font-size: 12px; color: #7f8c8d; margin-bottom: 8px; font-style: italic; }
    .hover-tooltip table { border-collapse: collapse; }
    .hover-tooltip th, .hover-tooltip td { padding: 4px 8px; border: 1px solid #e2e8f0; text-align: left; white-space: nowrap; }
    .hover-tooltip th { background: #f8fafc; font-weight: 600; color: #34495e; }
    .hover-tooltip td:first-child { font-weight: 600; color: #7f8c8d; }
    .hover-tooltip .alt-note {
      margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e2e8f0;
      font-size: 11px; color: #7f8c8d; line-height: 1.4;
      white-space: normal; max-width: 360px;
    }
    .hover-tooltip .instance-note {
      margin-top: 8px; padding: 6px 10px; background: #eaf4fd; color: #2980b9;
      font-size: 12px; font-weight: 600; border-radius: 4px;
      white-space: normal; max-width: 360px;
    }

    /* Word panel */
    .hover-tooltip .gloss { font-size: 13px; color: #34495e; margin: 4px 0 8px; font-style: italic; }
    .hover-tooltip .surface { font-size: 12px; color: #7f8c8d; font-weight: 400; }
    .hover-tooltip .verb-badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px; font-weight: 600; vertical-align: middle; margin-left: 4px; }
    .hover-tooltip .verb-badge.perfective { background: #e8f5e8; color: #27ae60; }
    .hover-tooltip .verb-badge.imperfective { background: #fff3cd; color: #b7791f; }
    .hover-tooltip .features { font-size: 11px; color: #7f8c8d; margin: 4px 0 8px; white-space: normal; }
    .hover-tooltip .aspect-pair { font-size: 12px; margin: 6px 0; white-space: normal; }
    .hover-tooltip .verb-section { margin: 10px 0; }
    .hover-tooltip .verb-section-title { font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .hover-tooltip .conj-table { border-collapse: collapse; }
    .hover-tooltip .conj-table td { padding: 1px 10px 1px 0; border: none; }
    .hover-tooltip .conj-table td:first-child { color: #95a5a6; font-size: 11px; }
    .hover-tooltip .future { font-size: 12px; font-style: italic; color: #2c3e50; white-space: normal; }
    .hover-tooltip .governs { font-size: 12px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e2e8f0; white-space: normal; }
    .hover-tooltip .driven-by { font-size: 12px; margin-top: 8px; padding: 6px 10px; background: #fff3cd; color: #856404; border-radius: 4px; white-space: normal; }
    .hover-tooltip .examples { font-size: 12px; color: #7f8c8d; margin-top: 8px; font-style: italic; white-space: normal; }
    .hover-tooltip .vzor-title { font-size: 11px; font-weight: 600; color: #7f8c8d; margin-top: 10px; padding-top: 8px; border-top: 1px dashed #e2e8f0; text-transform: uppercase; letter-spacing: 0.5px; }
    .hover-tooltip .reflexive-note {
      margin: 4px 0 6px; padding: 6px 10px; background: #e0f0ff; color: #2980b9;
      font-size: 12px; font-weight: 600; border-radius: 4px; white-space: normal;
    }
    .hover-tooltip .prep-governs {
      font-size: 13px; margin: 6px 0; padding: 8px 12px;
      background: #eaf4fd; color: #2980b9; border-radius: 4px;
      font-weight: 600; white-space: normal;
    }
    .hover-tooltip .spoken {
      font-size: 13px; margin: 6px 0; padding: 8px 12px;
      background: #fff3cd; color: #856404; border-radius: 4px;
      white-space: normal;
    }

    /* Reading mode */
    #reading-container { display: none; }
    .reading-header { margin-bottom: 20px; }
    .reading-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
    .reading-title { font-size: 22px; font-weight: 700; color: #2c3e50; margin: 0; }
    .reading-level { font-size: 12px; padding: 2px 8px; background: #e2e8f0; color: #34495e; border-radius: 10px; }
    .reading-credit { font-size: 12px; color: #95a5a6; line-height: 1.5; }
    .reading-credit a { color: #3498db; }
    .reading-body { font-size: 17px; line-height: 1.8; color: #2c3e50; margin: 20px 0; padding: 20px; background: #f8fafc; border-radius: 8px; }
    .reading-body .missing { color: #c0392b; font-style: italic; }

    .reading-practice {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed #e2e8f0;
    }
    .reading-practice-label {
      font-size: 13px;
      color: #7f8c8d;
      margin-bottom: 10px;
    }
    .practice-btn {
      width: 100%;
      padding: 14px;
      background: #3498db;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: background .15s;
      font-family: inherit;
    }
    .practice-btn:hover {
      background: #2980b9;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Čeština pro cizince</h1>

  <div class="lang-bar">
    <label for="learner-lang">Vysvětlení v:</label>
    <select id="learner-lang"></select>
  </div>

  <div id="start-screen">
    <div class="intro">
      <h2>Vyber si téma</h2>
      <p>Každé cvičení obsahuje 10 náhodných otázek.</p>
    </div>
    <div id="topic-grid"></div>
  </div>

  <div id="quiz-container" style="display:none">
    <button class="link-btn" onclick="Quiz.home()">← Změnit téma</button>
    <div class="progress" id="progress">Otázka 1</div>
    <div class="card">
      <div class="sentence" id="sentence"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>

    <div class="quiz-nav">
      <button id="prev-btn" class="nav-btn" onclick="Quiz.prev()">← Předchozí</button>
      <button id="next-btn" class="nav-btn" onclick="Quiz.next()">Další →</button>
    </div>
  </div>

  <div id="score-container" class="score-screen">
    <h2>Konec testu!</h2>
    <p>Výsledek:</p>
    <div class="score-num" id="final-score">0 / 0</div>
    <div class="lifetime" id="lifetime"></div>
    <button class="next-btn" style="margin-top:20px;" onclick="Quiz.start(Quiz.state.topic)">Znovu stejné téma</button>
    <button class="next-btn" style="background:#95a5a6; margin-top:10px;" onclick="Quiz.home()">Vybrat jiné téma</button>
  </div>

  <div id="reading-container">
    <button class="link-btn" onclick="Reading.home()">← Změnit téma</button>
    <div class="reading-header">
      <div class="reading-title-row">
        <h2 class="reading-title" id="reading-title"></h2>
        <span class="reading-level" id="reading-level"></span>
      </div>
      <div class="reading-credit" id="reading-credit"></div>
    </div>
    <div class="reading-body" id="reading-body"></div>
    <div id="reading-practice" class="reading-practice" style="display:none"></div>
  </div>
</div>

<div id="hover-tooltip" class="hover-tooltip"></div>

<script src="data/tables.js"></script>
<script src="data/questions.js"></script>
<script src="data/texts.js"></script>
<script src="js/storage.js"></script>
<script src="js/engine.js"></script>
<script src="js/reading.js"></script>
<script>
  (function () {
    const problems = [];
    if (typeof DECLENSION_TABLES === "undefined") problems.push("data/tables.js se nenačetl.");
    if (typeof QUESTION_BANK === "undefined")     problems.push("data/questions.js se nenačetl.");
    if (typeof TEXTS === "undefined")             problems.push("data/texts.js se nenačetl.");
    if (typeof Store === "undefined")             problems.push("js/storage.js se nenačetl.");
    if (typeof Quiz === "undefined")              problems.push("js/engine.js se nenačetl.");
    if (typeof Reading === "undefined")           problems.push("js/reading.js se nenačetl.");
    if (typeof availableLangs === "undefined")    problems.push("engine.js je zastaralý — chybí availableLangs().");
    if (problems.length) {
      document.body.innerHTML =
        '<div style="max-width:600px;margin:40px auto;background:#f8d7da;color:#721c24;padding:20px;border-radius:12px;">' +
        '<h3>Chyba při načítání</h3><ul><li>' + problems.join('</li><li>') + '</li></ul>' +
        '<p style="font-size:13px;">Zkontroluj soubory a spusť <code>python3 tools/import-csv.py questions.csv</code>.</p></div>';
      return;
    }

    const langs = availableLangs();
    const langSel = document.getElementById("learner-lang");
    const defaultLang = langs.includes("en") ? "en" : (langs[0] || "cs");
    const savedLang = Store.getLang(defaultLang);
    if (langs.length === 0) {
      const opt = document.createElement("option");
      opt.value = opt.textContent = "cs";
      langSel.appendChild(opt);
    } else {
      langs.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = (typeof LANG_NAMES !== "undefined" && LANG_NAMES[l]) || l;
        if (l === savedLang) opt.selected = true;
        langSel.appendChild(opt);
      });
    }
    langSel.addEventListener("change", e => {
      Store.setLang(e.target.value);
      if (Quiz.state.topic) Quiz.refreshExplanation();
      // Re-render the open tooltip with the new language
      const tip = document.getElementById("hover-tooltip");
      if (tip && tip.classList.contains("visible")) {
        const active = document.querySelector(".hoverable:hover") ||
                       document.querySelector(".hoverable.driver-highlight") ||
                       document.querySelector(".hoverable.reflexive-highlight");
        if (active && active.dataset.word) {
          Tooltip.showWord(active, active.dataset.word);
        } else if (active && active.dataset.table) {
          Tooltip.show(active, active.dataset.table, active.dataset.note || null);
        }
      }
    });

    const TOPIC_GROUPS = [
      {
        kind: "quiz",
        title: "Cvičení",
        sub: "Trénuj jednotlivá témata",
        topics: [
          "dative_instrumental",
          "genitive_accusative",
          "locative",
          "verb_case",
          "past_tense",
          "plural_nominative",
          "verbal_aspect",
        ],
      },
      {
        kind: "quiz",
        title: "Testy",
        sub: "Smíšené otázky ze všech témat",
        topics: ["mixed"],
      },
      {
        kind: "reading",
        title: "Čtení",
        sub: "Adaptované texty s výkladem slovíček",
        texts: TEXTS,
      },
      {
        kind: "textPractice",
        title: "Cvičení z textů",
        sub: "Procvič slovíčka a mluvnici z adaptovaných textů",
      },
    ];

    const TOPIC_INFO = {
      dative_instrumental: { title: "3. a 7. pád",       sub: "Dativ / Instrumentál" },
      genitive_accusative: { title: "2. a 4. pád",       sub: "Genitiv / Akuzativ" },
      locative:            { title: "6. pád",            sub: "Lokál" },
      past_tense:          { title: "Minulý čas",        sub: "Slovesa" },
      verb_case:           { title: "Slovesa + pád",     sub: "Jaký pád vyžaduje sloveso?" },
      plural_nominative:   { title: "Nominativ plurál",  sub: "Množné číslo (1. pád)" },
      mixed:               { title: "Smíšený test",      sub: "15 náhodných otázek ze všech témat" },
      verbal_aspect:       { title: "Slovesný vid",      sub: "Dokonavý / nedokonavý" },
    };

    const totalQuestions = Object.values(QUESTION_BANK).reduce((s, qs) => s + qs.length, 0);

    const grid = document.getElementById("topic-grid");
    TOPIC_GROUPS.forEach(group => {
      const section = document.createElement("section");
      section.className = "topic-group";
      const header = document.createElement("div");
      header.className = "group-header";
      header.innerHTML = `<h3>${group.title}</h3><p>${group.sub}</p>`;
      section.appendChild(header);
      const body = document.createElement("div");
      body.className = "group-body";

      if (group.kind === "reading") {
        group.texts.forEach(t => {
          const card = document.createElement("button");
          card.className = "topic-card";
          const pub = t.source?.publication || "";
          card.innerHTML = `<h3>${t.title}</h3><div class="meta">${t.level || ""} · ${pub}</div>`;
          card.onclick = () => Reading.start(t.id);
          body.appendChild(card);
        });
      } else if (group.kind === "textPractice") {
        TEXTS
          .filter(t => t.practiceTopic && QUESTION_BANK[t.practiceTopic]?.length)
          .forEach(t => {
            const count = QUESTION_BANK[t.practiceTopic].length;
            const card = document.createElement("button");
            card.className = "topic-card";
            card.innerHTML = `<h3>${t.title}</h3><div class="meta">Slovíčka a mluvnice z textu · ${count} otázek</div>`;
            card.onclick = () => Quiz.start(t.practiceTopic);
            body.appendChild(card);
          });
      } else {
        group.topics.forEach(key => {
          const info = TOPIC_INFO[key] || { title: key, sub: "" };
          const count = key === "mixed"
            ? `${totalQuestions} otázek celkem`
            : (QUESTION_BANK[key] ? `${QUESTION_BANK[key].length} otázek` : "");
          const card = document.createElement("button");
          card.className = "topic-card";
          card.innerHTML = `<h3>${info.title}</h3><div class="meta">${info.sub} · ${count}</div>`;
          card.onclick = () => Quiz.start(key);
          body.appendChild(card);
        });
      }
      
      section.appendChild(body);
      grid.appendChild(section);
    });
  })();
</script>
</body>
</html>
