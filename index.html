<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čeština pro cizince - Generátor testů</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f0f4f8; padding: 20px; }
    .container { max-width: 640px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; text-align: center; font-size: 24px; margin-bottom: 5px; }
    .lang-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; font-size: 13px; color: #7f8c8d; margin-bottom: 15px; }
    .lang-bar select { font-size: 13px; padding: 4px 8px; border-radius: 6px; }
    .intro { text-align: center; margin-bottom: 20px; }
    .intro h2 { color: #2c3e50; font-size: 20px; margin: 0 0 6px; }
    .intro p { color: #7f8c8d; font-size: 14px; margin: 0; }
    .topic-grid { display: grid; gap: 12px; }
    .topic-card { padding: 18px 20px; border: 2px solid #e2e8f0; border-radius: 12px; cursor: pointer; text-align: left; background: #fff; transition: border-color .15s, background .15s, transform .15s; }
    .topic-card:hover { border-color: #3498db; background: #f0f9ff; transform: translateY(-1px); }
    .topic-card h3 { margin: 0 0 4px; color: #2c3e50; font-size: 17px; }
    .topic-card .meta { font-size: 13px; color: #7f8c8d; }
    .progress { text-align: right; font-size: 13px; color: #95a5a6; }
    .card { background: #f8fafc; border-left: 5px solid #3498db; padding: 15px; border-radius: 4px; margin-bottom: 15px; }
    .sentence { font-size: 18px; font-weight: 500; margin-bottom: 5px; }
    .hint { font-size: 13px; color: #7f8c8d; font-style: italic; }
    .options { display: grid; gap: 10px; margin-top: 15px; }
    button { padding: 12px; font-size: 15px; border: 2px solid #e2e8f0; background: #fff; border-radius: 8px; cursor: pointer; text-align: left; font-family: inherit; }
    button:hover:not(:disabled) { border-color: #3498db; background: #f0f9ff; }
    .correct-btn { background: #2ecc71 !important; border-color: #2ecc71 !important; color: white; }
    .wrong-btn { background: #e74c3c !important; border-color: #e74c3c !important; color: white; }
    .feedback { margin-top: 15px; padding: 12px; border-radius: 8px; font-weight: bold; text-align: center; display: none; }
    .feedback.correct { display: block; background: #d4edda; color: #155724; }
    .feedback.wrong { display: block; background: #f8d7da; color: #721c24; }
    .explanation { margin-top: 8px; font-size: 13px; color: #34495e; text-align: center; }
    .next-btn { display: block; width: 100%; margin-top: 15px; background: #3498db; color: white; border: none; text-align: center; height: 45px; cursor: pointer; border-radius: 8px; font-size: 16px; }
    .next-btn:hover:not(:disabled) { background: #2980b9; border: none; }
    .score-screen { text-align: center; display: none; }
    .score-num { font-size: 40px; font-weight: bold; color: #2ecc71; margin: 15px 0; }
    .lifetime { font-size: 13px; color: #7f8c8d; margin-top: 8px; }
    .type-input { width: 100%; box-sizing: border-box; padding: 12px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
    .type-input:focus { outline: none; border-color: #3498db; }
    .correct-input { border-color: #2ecc71 !important; background: #f0fff4; }
    .wrong-input { border-color: #e74c3c !important; background: #fff5f5; }
    .check-btn { background: #3498db; color: white; border: none; font-weight: 500; margin-top: 10px; }
    .check-btn:hover:not(:disabled) { background: #2980b9; }
    .link-btn { background: none; border: none; color: #3498db; text-decoration: underline; cursor: pointer; padding: 4px 8px; font-size: 13px; margin: 0 auto 10px; display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>Čeština pro cizince</h1>

  <div class="lang-bar">
    <label for="learner-lang">Vysvětlení v:</label>
    <select id="learner-lang"></select>
  </div>

  <div id="start-screen">
    <div class="intro">
      <h2>Vyber si téma</h2>
      <p>Každý test obsahuje 10 náhodných otázek.</p>
    </div>
    <div class="topic-grid" id="topic-grid"></div>
  </div>

  <div id="quiz-container" style="display:none">
    <button class="link-btn" onclick="Quiz.home()">← Změnit téma</button>
    <div class="progress" id="progress">Otázka 1</div>
    <div class="card">
      <div class="sentence" id="sentence"></div>
      <div class="hint" id="hint"></div>
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="next-button" style="display:none;" onclick="Quiz.next()">Další otázka</button>
  </div>

  <div id="score-container" class="score-screen">
    <h2>Konec testu!</h2>
    <p>Výsledek z 10 otázek:</p>
    <div class="score-num" id="final-score">0 / 0</div>
    <div class="lifetime" id="lifetime"></div>
    <button class="next-btn" style="margin-top:20px;" onclick="Quiz.start(Quiz.state.topic)">Znovu stejné téma</button>
    <button class="next-btn" style="background:#95a5a6; margin-top:10px;" onclick="Quiz.home()">Vybrat jiné téma</button>
  </div>
</div>

<script src="data/questions.js"></script>
<script src="js/storage.js"></script>
<script src="js/engine.js"></script>
<script>
  // Visible load guard: if any of the above failed, show it instead of "Načítání…".
  (function () {
    const problems = [];
    if (typeof QUESTION_BANK === "undefined") problems.push("data/questions.js se nenačetl.");
    if (typeof Store === "undefined")        problems.push("js/storage.js se nenačetl.");
    if (typeof Quiz === "undefined")         problems.push("js/engine.js se nenačetl (nebo je stará verze).");
    if (typeof availableLangs === "undefined") problems.push("engine.js je zastaralý — chybí availableLangs().");
    if (problems.length) {
      document.body.innerHTML =
        '<div style="max-width:600px;margin:40px auto;background:#f8d7da;color:#721c24;padding:20px;border-radius:12px;">' +
        '<h3>Chyba při načítání</h3><ul><li>' + problems.join('</li><li>') + '</li></ul>' +
        '<p style="font-size:13px;">Zkontroluj, že všechny soubory jsou aktuální a že jsi spustil <code>node tools/import-csv.js questions.csv</code>.</p></div>';
      return;
    }

    // Language selector
    const langs = availableLangs();
    const langSel = document.getElementById("learner-lang");
    const defaultLang = langs.includes("en") ? "en" : (langs[0] || "cs");
    const savedLang = Store.getLang(defaultLang);
    if (langs.length === 0) {
      const opt = document.createElement("option");
      opt.value = opt.textContent = "cs";
      langSel.appendChild(opt);
    } else {
      langs.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l;
        opt.textContent = (typeof LANG_NAMES !== "undefined" && LANG_NAMES[l]) || l;
        if (l === savedLang) opt.selected = true;
        langSel.appendChild(opt);
      });
    }
    langSel.addEventListener("change", e => {
      Store.setLang(e.target.value);
      if (Quiz.state.topic) Quiz.refreshExplanation();
    });

    // Topic picker
    const TOPIC_INFO = {
  dative_instrumental: { title: "3. a 7. pád",       sub: "Dativ / Instrumentál" },
  genitive_accusative: { title: "2. a 4. pád",       sub: "Genitiv / Akuzativ" },
  locative:            { title: "6. pád",            sub: "Lokál" },
  past_tense:          { title: "Minulý čas",        sub: "Slovesa" },
  verb_case:           { title: "Slovesa + pád",     sub: "Jaký pád vyžaduje sloveso?" },
  plural_nominative:   { title: "Nominativ plurál",  sub: "Množné číslo (1. pád)" },
};
    const grid = document.getElementById("topic-grid");
    Object.entries(QUESTION_BANK).forEach(([key, qs]) => {
      const info = TOPIC_INFO[key] || { title: key, sub: "" };
      const card = document.createElement("button");
      card.className = "topic-card";
      card.innerHTML = `<h3>${info.title}</h3><div class="meta">${info.sub} · ${qs.length} otázek</div>`;
      card.onclick = () => Quiz.start(key);
      grid.appendChild(card);
    });
  })();
</script>
</body>
</html>
